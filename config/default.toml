# 기본 설정. 단위 mm, 초, 라디안. 좌표계는 ADR-003.
# "# 임시"가 붙은 값은 하드웨어 담당자 확인 전 값이다 (ADR-004).

[net]
length_mm = 6000          # 그물 전체 길이 (조립설명서, 실제 현장의 1/3 축척으로 확정 ADR-012)
max_gap_mm = 1500         # 기둥 간 최대 간격
taper_length_mm = 2600    # 임시. 보관 → 기둥2 진행 방향 거리. 대각 구간이 3m를 넘지 않게 정함
hook_tol_mm = 30          # 임시. 기둥 로봇이 그물선에 이만큼 다가가면 링 클립에 걸린다고 봄 (ADR-011)

[robot]
wheelbase_mm = 280
min_turn_radius_mm = 590
radius_mm = 208           # 장애물 부풀림용 외접 반지름
max_speed_mm_s = 300      # 임시
steer_delay_s = 0.1       # 임시

[arrival]
position_mm = 50          # 임시
heading_rad = 0.087       # 임시 (약 5도)
settle_s = 1.0            # 임시

# 시뮬레이터 (S2). 카메라 값은 2-1 카메라 점검, 와치독 값은 펌웨어 확정 후 고침
[sim]
camera_latency_s = 0.1    # 임시
pos_noise_mm = 5          # 임시. 위치 잡음 표준편차
heading_noise_rad = 0.01  # 임시. 방향 잡음 표준편차
occlusion_prob = 0.02     # 임시. 읽을 때마다 로봇별 가림 확률
watchdog_hold_s = 0.3     # 임시. 명령이 끊겨도 마지막 명령을 유지하는 시간
watchdog_stop_s = 1.0     # 임시. 최고 속도에서 감속 정지까지 걸리는 시간

# 전개 경로 계획 (S5, ADR-010)
[planning]
clearance_mm = 50         # 임시. 차량·다른 로봇과 띄울 여유 (반지름에 더함)
step_mm = 20              # 경로 검사 샘플 간격
stage_gap_mm = 600        # 임시. 경계선 위에 줄 세울 때 로봇 간격

# 사고 형태별 여유 거리 (범위 전체에 더함). 법적 근거 없음, 시연 파라미터
[margins]
damaged = 300             # 임시
overturned = 500          # 임시
fire = 800                # 임시

[placement]
upstream_margin_mm = 300  # 임시. 기둥2 = 범위 상류 끝 - 이 값
downstream_margin_mm = 300  # 임시. 당김 = 범위 하류 끝 + 이 값

# 도로. 차선 폭은 3.5m의 1/3. 바닥 크기는 임시
[road]
x_min_mm = 0              # 임시
x_max_mm = 9000           # 임시
lanes = [
  { name = "shoulder", y_min_mm = -1000, y_max_mm = 0 },     # 갓길 폭 임시
  { name = "lane2",    y_min_mm = 0,     y_max_mm = 1167 },
  { name = "lane1",    y_min_mm = 1167,  y_max_mm = 2333 },
]
# 테이프 차선 (도로 좌표 꺾은선). 차선 모델 출력도 변환 후 이 형식
lines = [
  { name = "shoulder_line", kind = "solid",  points = [[0, 0], [9000, 0]] },
  { name = "lane_boundary", kind = "dashed", points = [[0, 1167], [9000, 1167]] },
  { name = "center_line",   kind = "solid",  points = [[0, 2333], [9000, 2333]] },
]

# 로봇 목록. 순서는 그물에 꿰인 순서
[[robots]]
robot_id = 0
role = "reserve"
[[robots]]
robot_id = 1
role = "post1"
[[robots]]
robot_id = 2
role = "post2"
[[robots]]
robot_id = 3
role = "post3"
[[robots]]
robot_id = 4
role = "puller"

# 대기 배치. 전부 임시: 갓길 두 줄 (ADR-011)
# 안쪽 줄(y -250)에 보관·당김이 서고 그 사이로 그물이 지난다. 기둥 3대는 바깥 줄(y -760)에서 그물과 떨어져 대기.
# 기둥은 그물에 꿰여 있지 않아 줄 순서가 자유롭다
[[standby]]
robot_id = 0
x = 400
y = -250
heading = 0.0
[[standby]]
robot_id = 1
x = 900
y = -760
heading = 0.0
[[standby]]
robot_id = 2
x = 1400
y = -760
heading = 0.0
[[standby]]
robot_id = 3
x = 1900
y = -760
heading = 0.0
[[standby]]
robot_id = 4
x = 2400
y = -250
heading = 0.0
