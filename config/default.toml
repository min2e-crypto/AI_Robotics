# 기본 설정. 단위 mm, 초, 라디안. 좌표계는 ADR-003.
# "# 임시"가 붙은 값은 하드웨어 담당자 확인 전 값이다 (ADR-004).

[net]
length_mm = 6000          # 그물 전체 길이 (조립설명서)
max_gap_mm = 1500         # 기둥 간 최대 간격
taper_length_mm = 2600    # 임시. 보관 → 기둥2 진행 방향 거리. 대각 구간이 3m를 넘지 않게 정함

[robot]
wheelbase_mm = 280
min_turn_radius_mm = 590
radius_mm = 208           # 장애물 부풀림용 외접 반지름
max_speed_mm_s = 300      # 임시
steer_delay_s = 0.1       # 임시

[arrival]
position_mm = 50          # 임시
heading_rad = 0.087       # 임시 (약 5도)
settle_s = 1.0            # 임시

# 사고 형태별 여유 거리 (범위 전체에 더함). 법적 근거 없음, 시연 파라미터
[margins]
damaged = 300             # 임시
overturned = 500          # 임시
fire = 800                # 임시

[placement]
upstream_margin_mm = 300  # 임시. 기둥2 = 범위 상류 끝 - 이 값
downstream_margin_mm = 300  # 임시. 당김 = 범위 하류 끝 + 이 값

# 도로. 차선 폭은 3.5m의 1/3. 바닥 크기는 임시
[road]
x_min_mm = 0              # 임시
x_max_mm = 9000           # 임시
lanes = [
  { name = "shoulder", y_min_mm = -1000, y_max_mm = 0 },     # 갓길 폭 임시
  { name = "lane2",    y_min_mm = 0,     y_max_mm = 1167 },
  { name = "lane1",    y_min_mm = 1167,  y_max_mm = 2333 },
]
# 테이프 차선 (도로 좌표 꺾은선). 차선 모델 출력도 변환 후 이 형식
lines = [
  { name = "shoulder_line", kind = "solid",  points = [[0, 0], [9000, 0]] },
  { name = "lane_boundary", kind = "dashed", points = [[0, 1167], [9000, 1167]] },
  { name = "center_line",   kind = "solid",  points = [[0, 2333], [9000, 2333]] },
]

# 로봇 목록. 순서는 그물에 꿰인 순서
[[robots]]
robot_id = 0
role = "reserve"
[[robots]]
robot_id = 1
role = "post1"
[[robots]]
robot_id = 2
role = "post2"
[[robots]]
robot_id = 3
role = "post3"
[[robots]]
robot_id = 4
role = "puller"

# 대기 배치. 전부 임시: 갓길 상류에 진행 방향으로 한 줄 (당김 로봇이 맨 앞)
[[standby]]
robot_id = 0
x = 400
y = -500
heading = 0.0
[[standby]]
robot_id = 1
x = 900
y = -500
heading = 0.0
[[standby]]
robot_id = 2
x = 1400
y = -500
heading = 0.0
[[standby]]
robot_id = 3
x = 1900
y = -500
heading = 0.0
[[standby]]
robot_id = 4
x = 2400
y = -500
heading = 0.0
